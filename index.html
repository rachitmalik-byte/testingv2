<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    
    <meta name="description" content="STEM AI Trainers connects enterprises with world-class domain experts for AI training, RLHF, model evaluation, and synthetic data generation across 30+ countries." />
    <meta name="keywords" content="AI training, RLHF, model evaluation, synthetic data, STEM experts, AI annotation" />
    <meta name="robots" content="index, follow" />

    <meta property="og:title" content="STEM AI Trainers — The Human Reasoning Behind Frontier AI" />
    <meta property="og:description" content="Enterprise AI training operations powered by world-class domain experts across 30+ countries." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stemaitrainers.com/" />

    <!-- Preconnect to font servers early (saves ~150ms RTT) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- FIX: Load fonts async so they NEVER block FCP -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!--
      VIDEO POSTER NOTE:
      To fix your 5.92s LCP: extract a poster image from hand_shake.mp4 with:
        ffmpeg -i public/hand_shake.mp4 -ss 0.5 -frames:v 1 -q:v 5 public/hand_shake_poster.jpg
      Then the <video> tag in Home.tsx already uses poster="/hand_shake_poster.jpg"
      This gives users INSTANT visual feedback while the video loads in background.
    -->

    <title>STEM AI Trainers — Human Reasoning Behind Frontier AI</title>

    <!-- Theme init: runs before paint to avoid flash of wrong theme -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('vaidik-theme');
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'dark' || (!t && d)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
